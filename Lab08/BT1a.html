<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May tinh co ban</title>
    <style>
    
    </style>
</head>
<body>
    <h1>May tinh co ban - BT1</h1>
    <table border="1">
        <tr>
          <td>A =</td>
          <td><input type="text" id="numberA"></td>
        </tr>
      
        <tr>
          <td>B =</td>
          <td><input type="text" id="numberB"></td>
        </tr>
      
        <tr>
          <td></td>
          <td>
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">/</button>
          </td>
        </tr>
      
        <tr>
          <td>Kết quả:</td>
          <td><input type="text" id="result" disabled></td>
        </tr>
      </table>
    <script>
        const numberAElement = document.querySelector('#numberA');
        const numberBElement = document.querySelector('#numberB');
        const resultElement = document.querySelector('#result');
        function calculate (operator) {
            const a = Number(numberAElement.value);
            const b = Number(numberBElement.value);
            let result;
            if(operator === '+') {
            result = a+b;
        }
        else if(operator === '-') {
            result = a-b;
        }
        else if(operator === '*') {
            result = a*b;
        }
        else if(operator === '/') {
            if(b===0) {
                resultElement.value = 'Khong chia duoc cho 0'
                return;
            }
            result = a/b;
        }
        resultElement.value = result;
        }
        
    </script>
</body>
</html>
